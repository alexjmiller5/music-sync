[project]
name = "music-sync"
version = "0.1.0"
description = "Two-way Spotify <-> Notion playlist sync"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
]

[dependency-groups]
dev = [
    "modal>=1.0",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." for app.py at the repo root
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
